name: CD

on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]
    branches: [ main ]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v5

      - name: Set image version
        run: |
          VERSION=$(grep -m1 'VERSION:' .github/workflows/CI.yml | awk '{print $2}')
          sed -i "s|IMAGE_PLACEHOLDER|${{ secrets.DOCKERHUB_USERNAME }}/weather-ml-app:$VERSION|" k8s/deployment.yaml
          grep 'image:' k8s/deployment.yaml

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Wait for rolling update
        run: kubectl rollout status deployment/weather-ml-app --timeout=180s

      - name: Show pods and service
        run: |
          kubectl get pods -l app=weather-ml-app
          kubectl get service weather-ml-app