name: CI

on:
  push:
    branches: [ main, feature/ci-cd ]
  pull_request:
    branches: [ main ]

env:
  IMAGE: weather-ml-app
  VERSION: v1

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install requirements
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke test
        run: python -m unittest tests/smoke_test.py

      - name: Unit tests
        run: python -m unittest tests/unit_test.py

      - name: Integration test
        run: python -m unittest tests/integration_test.py

      - name: Build image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE:$VERSION .

      - name: Check container starts
        run: |
          docker run -d -p 5000:5000 --name weather-app ${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE:$VERSION
          sleep 10
          curl -f http://localhost:5000/ || (docker logs weather-app && exit 1)
          docker rm -f weather-app

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push'
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE:$VERSION